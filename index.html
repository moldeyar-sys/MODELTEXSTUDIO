<!doctype html>

    <meta charset="UTF-8" />

    <!-- Iconos del sitio: el maniqui de la marca, recortado del telon negro
         (que no forma parte de la paleta) y centrado con aire. Google recorta
         el favicon en CIRCULO en los resultados de busqueda: si el dibujo toca
         los bordes, el recorte le come los hombros y la base.
         Antes /favicon.ico no existia y, como todo lo que no se encuentra va a
         index.html, a Google le llegaba la pagina HTML entera en vez de un
         icono. Ahora el archivo existe.
         Los genera: npm run iconos -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="96x96" href="/brand/favicon-96.png?v=4" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/favicon-192.png?v=4" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png?v=4" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0048AD" />

    <!-- middleware.ts inyecta un main[data-bot-content] con el contenido real
         de cada pagina (H1, texto, enlaces internos) en el HTML inicial, igual
         para usuarios y robots. Con JavaScript no se ve nunca: se oculta por
         CSS antes del primer pintado y src/main.tsx lo borra al montar React,
         asi el usuario no ve un destello de texto sin estilos. Sin JavaScript
         (navegador con JS deshabilitado, GPTBot, ClaudeBot, PerplexityBot,
         Bingbot) es lo unico que hay, y por eso el <noscript> lo muestra con
         un estilo minimo legible. -->
    <style>
      [data-bot-content] { display: none; }
    </style>
    <noscript>
      <style>
        [data-bot-content] {
          display: block;
          max-width: 46rem;
          margin: 0 auto;
          padding: 1.5rem 1rem 3rem;
          font-family: Inter, system-ui, -apple-system, sans-serif;
          line-height: 1.65;
          color: #1f2937;
        }
        [data-bot-content] h1 { font-size: 1.6rem; line-height: 1.25; margin: 0 0 .75rem; color: #0b2545; }
        [data-bot-content] h2 { font-size: 1.2rem; margin: 1.75rem 0 .5rem; color: #0b2545; }
        [data-bot-content] h3 { font-size: 1rem; margin: 1.25rem 0 .25rem; color: #0b2545; }
        [data-bot-content] a { color: #0048AD; }
        [data-bot-content] nav[aria-label="Ruta"] { font-size: .85rem; color: #6b7280; margin-bottom: 1rem; }
      </style>
    </noscript>

    <title>Modeltex | Moldes PDF, moldes para imprimir y molderia digital</title>
    <meta name="description" content="Moldería digital para producir: más de 2.000 moldes de ropa en PDF A4, plotter, DXF/AAMA, Optitex y Audaces, con curva de talles y descarga inmediata." />
    <meta name="keywords" content="moldes pdf, moldes para imprimir, moldes de ropa pdf, moldes pdf a4, moldes para plotter, molderia digital, moldes de ropa, patrones para imprimir" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <link rel="canonical" href="https://modeltex.com.ar/" />

    <!-- Verificación de Google Search Console (método "Etiqueta HTML"). Variable
         VITE_GSC_VERIFICATION en Vercel: sin configurar, content queda vacío y
         el meta no tiene ningún efecto ni error. -->
    <meta name="google-site-verification" content="%VITE_GSC_VERIFICATION%" />

    <!-- La imagen del Hero es el LCP (Largest Contentful Paint) de la home.
         Sin preload, el navegador recién la descubre cuando React monta
         HeroCarousel (después de bajar y ejecutar vendor-react + vendor-supabase
         + index, ~500 KB) en vez de apenas parsear este <head>. Es siempre el
         primer slide mostrado (fallbackSrc en HomePage.tsx), se reemplace o no
         después por una imagen que cargue el admin. -->
    <link rel="preload" as="image" href="/brand/modeltex-hero.webp" fetchpriority="high" type="image/webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Adelanta la conexion (DNS/TLS) a Supabase: la home y el catalogo
         piden datos ahi apenas monta React, asi ese primer pedido no pierde
         tiempo estableciendo la conexion desde cero. -->
    <link rel="preconnect" href="https://jotibqgyrcgwctiolhcw.supabase.co" />
